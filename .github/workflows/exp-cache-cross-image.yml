name: Cache cross-image experiment

# Throwaway experiment for fortran-lang/setup-fortran#273. Not for merging.
on:
  push:
    branches: [exp/cache-cross-image]

permissions:
  actions: read
  contents: read

jobs:
  # Second pass: the first pass's ifort 2021.13 entry disappeared before its
  # restore jobs ran, so repeat with a version whose key is not in the cache.
  intel:
    name: ${{ matrix.compiler }} ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: ifort, version: "2021.12" }
    uses: ./.github/workflows/exp-intel-pair.yml
    with:
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}
