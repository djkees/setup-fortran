name: Cache cross-image experiment

# Throwaway experiment for fortran-lang/setup-fortran#273. Not for merging.
on:
  push:
    branches: [exp/cache-cross-image]

permissions:
  actions: read
  contents: read

env:
  # Same key and path the action builds for gfortran 11 on ubuntu-24.04 x64.
  APT_KEY: apt-gfortran-v2-ubuntu24-x64-11
  APT_DIR: /home/runner/work/_temp/setup-fortran/apt/gfortran/ubuntu24/x64/11

jobs:
  # Third pass: does a gfortran apt entry whose files no longer match what apt
  # wants ever get replaced? Seed such an entry, then run the action twice.
  seed:
    name: seed a stale gfortran entry
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p "$APT_DIR"
          echo "not the packages apt wants" > "$APT_DIR/stale-marker.txt"
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.APT_DIR }}
          key: ${{ env.APT_KEY }}

  first:
    name: first run with the stale entry
    needs: [seed]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "11"
      - run: ls -la "$APT_DIR" | head -20

  second:
    name: second run (was the entry replaced?)
    needs: [first]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "11"
      - run: ls -la "$APT_DIR" | head -20
