name: exp intel pair

on:
  workflow_call:
    inputs:
      compiler: { type: string, required: true }
      version: { type: string, required: true }

permissions:
  actions: read
  contents: read

jobs:
  save:
    name: save on ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install (expected cache miss, saves the entry)
        uses: ./
        with:
          compiler: ${{ inputs.compiler }}
          version: ${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build:integration-test
      - name: Run Integration Tests
        run: npm run integration-test

  restore:
    name: restore on ${{ matrix.image }}
    needs: [save]
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-26.04, ubuntu-22.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install (expected cache hit from ubuntu-24.04)
        uses: ./
        with:
          compiler: ${{ inputs.compiler }}
          version: ${{ inputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build:integration-test
      - name: Run Integration Tests
        run: npm run integration-test
