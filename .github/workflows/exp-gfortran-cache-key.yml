name: gfortran cache key experiment

# Throwaway experiment for the Linux gfortran cache key change. Not for merging.
on:
  push:
    branches: [exp/gfortran-cache-key]

permissions:
  actions: read
  contents: read

env:
  APT_DIR: /home/runner/work/_temp/setup-fortran/apt/gfortran/ubuntu24/x64/16

jobs:
  seed:
    name: "seed a longer key with the same start (16, x64)"
    runs-on: ubuntu-24.04
    steps:
      - id: rev
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test >/dev/null
          rev=$(apt-cache policy gfortran-16 | awk '/Candidate:/{print $2}')
          echo "candidate: $rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          mkdir -p "$APT_DIR"
          echo "not the packages apt wants" > "$APT_DIR/stale-marker.txt"
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.APT_DIR }}
          key: apt-gfortran-v2-ubuntu24-x64-16-${{ steps.rev.outputs.rev }}.stale

  prefix-first:
    name: "5: first run, 16 x64 (expect no hit on longer key)"
    runs-on: ubuntu-24.04
    needs: [seed]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "16"
      - if: always()
        run: |
          apt-cache policy gfortran-16 | head -3
          ls -la "$APT_DIR" | head -8

  prefix-second:
    name: "5: second run, 16 x64 (expect hit)"
    runs-on: ubuntu-24.04
    needs: [prefix-first]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "16"
      - if: always()
        run: |
          apt-cache policy gfortran-16 | head -3
          ls -la "$APT_DIR" | head -8
