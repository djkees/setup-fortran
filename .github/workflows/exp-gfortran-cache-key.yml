name: gfortran cache key experiment

# Throwaway experiment for the Linux gfortran cache key change. Not for merging.
on:
  push:
    branches: [exp/gfortran-cache-key]

permissions:
  actions: read
  contents: read

env:
  APT_DIR: /home/runner/work/_temp/setup-fortran/apt/gfortran/ubuntu24/x64/11

jobs:
  seed:
    name: "seed an entry for a longer build string (11, x64)"
    runs-on: ubuntu-24.04
    steps:
      - id: rev
        run: |
          sudo apt-get update -y >/dev/null || true
          rev=$(apt-cache policy gfortran-11 | awk '/Candidate:/{print $2}')
          echo "candidate: $rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          mkdir -p "$APT_DIR"
          echo "not the packages apt wants" > "$APT_DIR/stale-marker.txt"
      - uses: actions/cache/save@v4
        with:
          path: ${{ env.APT_DIR }}
          key: apt-gfortran-v2-${{ steps.rev.outputs.rev }}.1-ubuntu24-x64-11

  first:
    name: "5: first run, 11 x64 (expect plain miss + save)"
    runs-on: ubuntu-24.04
    needs: [seed]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "11"
      - if: always()
        run: |
          apt-cache policy gfortran-11 | head -3
          ls -la "$APT_DIR"

  second:
    name: "5: second run, 11 x64 (expect hit)"
    runs-on: ubuntu-24.04
    needs: [first]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "11"
      - if: always()
        run: |
          apt-cache policy gfortran-11 | head -3
          ls -la "$APT_DIR"
