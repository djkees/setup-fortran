name: gfortran cache key experiment

# Throwaway experiment for the Linux gfortran cache key change. Not for merging.
on:
  push:
    branches: [exp/gfortran-cache-key]

permissions:
  actions: read
  contents: read

jobs:
  first-11:
    name: "first run, gfortran 11 (Ubuntu archive)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "11"
      - if: always()
        run: ls -la "$RUNNER_TEMP/setup-fortran/apt/gfortran/ubuntu24/x64/11" | head -6

  second-11:
    name: "second run, gfortran 11 (Ubuntu archive)"
    runs-on: ubuntu-24.04
    needs: [first-11]
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "11"
      - if: always()
        run: ls -la "$RUNNER_TEMP/setup-fortran/apt/gfortran/ubuntu24/x64/11" | head -6

  first-15:
    name: "first run, gfortran 15 (PPA)"
    runs-on: ubuntu-24.04
