  first-13:
    name: "first run, gfortran 13 (preinstalled)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: gfortran
          version: "13"
      - if: always()
        run: ls -la "$RUNNER_TEMP/setup-fortran/apt/gfortran/ubuntu24/x64/13" | head -6

  second-13:
    name: "second run, gfortran 13 (preinstalled)"
    runs-on: ubuntu-24.04
    needs: [first-13]
    steps:
      - uses: actions/checkout@v7
