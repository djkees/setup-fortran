name: Verify
on:
  push:
    branches:
      - verify/win-intel-cc-249
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, compiler: intel, version: '2022.2', expect: 'icx cl', toolchain: {compiler: intel, version: '2022.2'}}
          - {os: windows-2022, compiler: intel, version: '2023.2', expect: 'icx cl', toolchain: {compiler: intel, version: '2023.2'}}
          - {os: windows-2022, compiler: intel, version: '2024.1', expect: 'icx cl', toolchain: {compiler: intel, version: '2024.1'}}
          - {os: windows-2022, compiler: intel, version: '2025.0', expect: 'icx icx', toolchain: {compiler: intel, version: '2025.0'}}
          - {os: windows-2022, compiler: intel, version: '2025.2', expect: 'icx icx', toolchain: {compiler: intel, version: '2025.2'}}
          - {os: windows-2022, compiler: intel, version: '2025.3', expect: 'cl cl', toolchain: {compiler: intel, version: '2025.3'}}
          - {os: windows-2022, compiler: intel, version: '2026.1', expect: 'cl cl', toolchain: {compiler: intel, version: '2026.1'}}
          - {os: windows-2025, compiler: intel, version: '2025.3', expect: 'cl cl', toolchain: {compiler: intel, version: '2025.3'}}
          - {os: windows-2025, compiler: intel, version: '2026.1', expect: 'cl cl', toolchain: {compiler: intel, version: '2026.1'}}
          - {os: windows-2022, compiler: intel-classic, version: '2021.9', expect: 'icl cl', toolchain: {compiler: intel-classic, version: '2021.9'}}
          - {os: windows-2022, compiler: intel-classic, version: '2021.10', expect: 'icl cl', toolchain: {compiler: intel-classic, version: '2021.10'}}
          - {os: windows-2022, compiler: intel-classic, version: '2021.12', expect: 'cl cl', toolchain: {compiler: intel-classic, version: '2021.12'}}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      - name: Check CC/CXX
        shell: bash
        run: |
          echo "CC=$CC CXX=$CXX FC=$FC FPM_CC=$FPM_CC FPM_CXX=$FPM_CXX"
          [[ "$CC $CXX" == "${{ matrix.expect }}" ]]
      - name: test-cc action
        if: success() || failure()
        uses: ./.github/actions/test-cc
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      - name: test-cxx action
        if: success() || failure()
        uses: ./.github/actions/test-cxx
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      - name: CMake C and C++ build
        shell: cmd
        run: |
          mkdir cm
          echo cmake_minimum_required(VERSION 3.20) > cm\CMakeLists.txt
          echo project(p C CXX) >> cm\CMakeLists.txt
          echo add_executable(c ../test/hw.c) >> cm\CMakeLists.txt
          echo add_executable(x ../test/hw.cpp) >> cm\CMakeLists.txt
          cmake -S cm -B cmb -G Ninja || exit /b 1
          cmake --build cmb || exit /b 1
          cmb\c.exe || exit /b 1
          cmb\x.exe || exit /b 1
      - name: Write mixed-language project
        shell: bash
        run: |
          mkdir mixed
          cat > mixed/c_part.c <<'SRC'
          int c_add(int a, int b) { return a + b; }
          SRC
          cat > mixed/cxx_part.cpp <<'SRC'
          #include <iostream>
          extern "C" int cxx_mul(int a, int b) { std::cout << "cxx says hi" << std::endl; return a * b; }
          SRC
          cat > mixed/main.f90 <<'SRC'
          program main
            use iso_c_binding, only: c_int
            implicit none
            interface
              function c_add(a, b) bind(c, name='c_add') result(r)
                import :: c_int
                integer(c_int), value :: a, b
                integer(c_int) :: r
              end function
              function cxx_mul(a, b) bind(c, name='cxx_mul') result(r)
                import :: c_int
                integer(c_int), value :: a, b
                integer(c_int) :: r
              end function
            end interface
            print '(a,i0,a,i0)', 'MIXED_RESULT ', c_add(2, 3), ' ', cxx_mul(4, 5)
          end program
          SRC
          cat > mixed/CMakeLists.txt <<'SRC'
          cmake_minimum_required(VERSION 3.20)
          project(mixed C CXX Fortran)
          add_executable(mixed main.f90 c_part.c cxx_part.cpp)
          SRC
      - name: CMake mixed Fortran/C/C++ build
        shell: cmd
        run: |
          cmake -S mixed -B mixedb -G Ninja || exit /b 1
          cmake --build mixedb || exit /b 1
          mixedb\mixed.exe > mixed_out.txt || exit /b 1
          type mixed_out.txt
          findstr /c:"MIXED_RESULT 5 20" mixed_out.txt || exit /b 1
