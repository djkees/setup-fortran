name: tmp windows intel cache restore

on:
  push:
    branches: [test/win-intel-cache-validation]

permissions:
  actions: read
  contents: read

jobs:
  pair:
    name: ${{ matrix.compiler }} ${{ matrix.version }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { compiler: ifx, version: "2026.1.1" } # standalone installer
          - { compiler: ifx, version: "2025.0.0" }
          - { compiler: ifx, version: "2024.0.1" } # HPCKit, component filter
          - { compiler: ifx, version: "2023.2.1" }
          - { compiler: ifx, version: "2022.2.0" } # legacy HPCKit, full install
          - { compiler: ifort, version: "2021.13" }
          - { compiler: ifort, version: "2021.10" }
          - { compiler: ifort, version: "2021.6" }
    uses: ./.github/workflows/tmp-win-intel-pair.yml
    with:
      compiler: ${{ matrix.compiler }}
      version: ${{ matrix.version }}

  unit-tests:
    name: jest ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test -- --verbose
