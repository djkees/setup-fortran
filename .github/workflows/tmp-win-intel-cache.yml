name: tmp windows intel cache restore

on:
  push:
    branches: [test/win-intel-cache-validation]

permissions:
  actions: read
  contents: read

jobs:
  save:
    name: save ${{ matrix.compiler }} ${{ matrix.version }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: ifx, version: "2026.1.1" }
          - { compiler: ifort, version: "2021.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}
      - name: Compile and run
        shell: cmd
        run: |
          echo program hello > hello.f90
          echo print *, "hello from %FC%" >> hello.f90
          echo end program hello >> hello.f90
          %FC% hello.f90 /Fe:hello.exe || exit /b 1
          hello.exe

  restore:
    name: restore ${{ matrix.compiler }} ${{ matrix.version }} ${{ matrix.image }}
    needs: [save]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2022, windows-2025]
        toolchain:
          - { compiler: ifx, version: "2026.1.1" }
          - { compiler: ifort, version: "2021.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - name: Compile and run
        shell: cmd
        run: |
          echo program hello > hello.f90
          echo print *, "hello from %FC%" >> hello.f90
          echo end program hello >> hello.f90
          %FC% hello.f90 /Fe:hello.exe || exit /b 1
          hello.exe
      - name: Registry and install footprint
        if: always()
        shell: cmd
        run: |
          reg query "HKLM\SOFTWARE\WOW6432Node\Intel" /s /f oneAPI 2>&1 | more +0
          dir "C:\Program Files (x86)\Intel\oneAPI"
          exit /b 0
