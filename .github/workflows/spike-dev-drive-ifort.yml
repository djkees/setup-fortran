# Spike: does mounting a trusted Windows Dev Drive (ReFS + async Defender
# scanning) speed up the ifort HPCKit silent install on windows-2022?
# Manual-only, not wired into the real CI matrix.
#
# v1 ran the Intel installer directly via a hand-rolled PowerShell `&`
# invocation and finished in ~1-2s with nothing installed - the installer
# detaches under a plain shell call, unlike the real action's exec.exec()
# (confirmed to block correctly for the real ~18 min install in
# production). v2 switched to running the actual action (`uses: ./`) and
# redirected just the final install directory (ONEAPI_ROOT is hardcoded to
# Program Files) onto the Dev Drive via a junction - result: only ~6%
# faster (17m17s vs 16m16s), both still solidly in the "slow" bucket. That
# suggests the installer's heavy I/O happens during extraction/staging in
# %TEMP%, not at the final install path. This version (v4) additionally
# redirects TEMP/TMP onto the Dev Drive for the dev-drive job (testing
# that directly), and - rather than keep guessing from wall-clock timing -
# captures Intel's own installer logs (default location is <install-dir>\
# logs, so it's already covered by the ONEAPI_ROOT junction on the
# dev-drive job) as workflow artifacts, so we can read the actual
# per-phase breakdown instead of inferring it.
name: "Spike: dev drive ifort install timing"

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install ifort 2021.9 (default Program Files location)
        uses: ./
        with:
          compiler: ifort
          version: "2021.9"

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-install-logs
          path: C:\Program Files (x86)\Intel\oneAPI\logs
          if-no-files-found: warn

  dev-drive:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Mount trusted Dev Drive
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          drive-format: ReFS
          mount-path: dev_drive
          trusted-dev-drive: true

      - name: Redirect oneAPI install path and TEMP/TMP onto the Dev Drive
        shell: pwsh
        run: |
          $target = Join-Path $env:DEV_DRIVE "oneAPI"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          New-Item -ItemType Directory -Path "C:\Program Files (x86)\Intel" -Force | Out-Null
          cmd /c mklink /J "C:\Program Files (x86)\Intel\oneAPI" "$target"

          $tempDir = Join-Path $env:DEV_DRIVE "temp"
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          "TEMP=$tempDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$tempDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install ifort 2021.9 (onto Dev Drive via junction)
        uses: ./
        with:
          compiler: ifort
          version: "2021.9"

      - name: Upload install logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-drive-install-logs
          path: C:\Program Files (x86)\Intel\oneAPI\logs
          if-no-files-found: warn
