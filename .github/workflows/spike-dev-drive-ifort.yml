# Spike: does mounting a trusted Windows Dev Drive (ReFS + async Defender
# scanning) speed up the ifort HPCKit silent install on windows-2022?
# Manual-only, not wired into the real CI matrix. Baseline vs. dev-drive
# both install ifort 2021.9 (the slowest version we measured, ~19 min cold
# on windows-2022) so the comparison is apples-to-apples in one run.
name: "Spike: dev drive ifort install timing"

on:
  workflow_dispatch:

env:
  IFORT_2021_9_URL: "https://registrationcenter-download.intel.com/akdlm/IRC_NAS/2a13d966-fcc5-4a66-9fcc-50603820e0c9/w_HPCKit_p_2023.1.0.46357_offline.exe"

jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Download ifort 2021.9 installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:IFORT_2021_9_URL -OutFile "$env:RUNNER_TEMP\ifort-2021.9.exe"

      - name: Time silent install (default Program Files location)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & "$env:RUNNER_TEMP\ifort-2021.9.exe" -s -a --silent --eula accept `
            -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0
          $sw.Stop()
          $seconds = [math]::Round($sw.Elapsed.TotalSeconds, 1)
          "BASELINE install time: $seconds seconds" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

  dev-drive:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Mount trusted Dev Drive
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          drive-format: ReFS
          mount-path: dev_drive
          trusted-dev-drive: true

      - name: Download ifort 2021.9 installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:IFORT_2021_9_URL -OutFile "$env:RUNNER_TEMP\ifort-2021.9.exe"

      - name: Time silent install (installed onto Dev Drive)
        shell: pwsh
        run: |
          $installDir = Join-Path $env:DEV_DRIVE "oneAPI"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & "$env:RUNNER_TEMP\ifort-2021.9.exe" -s -a --silent --eula accept `
            --install-dir "$installDir" `
            -p=NEED_VS2019_INTEGRATION=0 -p=NEED_VS2022_INTEGRATION=0
          $sw.Stop()
          $seconds = [math]::Round($sw.Elapsed.TotalSeconds, 1)
          "DEV DRIVE install time: $seconds seconds (installed to $installDir)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
