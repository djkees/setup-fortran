# Spike: does mounting a trusted Windows Dev Drive (ReFS + async Defender
# scanning) speed up the ifort HPCKit silent install on windows-2022?
# Manual-only, not wired into the real CI matrix.
#
# v1 of this spike ran the Intel installer directly via a hand-rolled
# PowerShell `&` invocation and finished in ~1-2 seconds with no error and
# no installed files - the installer clearly detaches/hands off rather than
# blocking under a plain shell invocation, unlike the real action's
# `exec.exec()` call (which we've confirmed blocks correctly for the real
# ~18 min install in production). Rather than reverse-engineer that
# difference, this version runs the *actual* action (`uses: ./`) so the
# install goes through the exact same code path as real CI. To redirect
# the install onto the Dev Drive without touching any TypeScript
# (ONEAPI_ROOT is hardcoded to Program Files), we create a directory
# junction at the install path pointing at the Dev Drive before invoking
# the action - the installer's writes land on ReFS transparently.
name: "Spike: dev drive ifort install timing"

on:
  workflow_dispatch:

jobs:
  baseline:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install ifort 2021.9 (default Program Files location)
        uses: ./
        with:
          compiler: ifort
          version: "2021.9"

  dev-drive:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Mount trusted Dev Drive
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          drive-format: ReFS
          mount-path: dev_drive
          trusted-dev-drive: true

      - name: Redirect oneAPI install path onto the Dev Drive
        shell: pwsh
        run: |
          $target = Join-Path $env:DEV_DRIVE "oneAPI"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          New-Item -ItemType Directory -Path "C:\Program Files (x86)\Intel" -Force | Out-Null
          cmd /c mklink /J "C:\Program Files (x86)\Intel\oneAPI" "$target"

      - name: Install ifort 2021.9 (onto Dev Drive via junction)
        uses: ./
        with:
          compiler: ifort
          version: "2021.9"
